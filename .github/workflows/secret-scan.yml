name: Secret scan

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        shell: bash
        run: |
          status=0
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 git /repo --redact --report-format json --report-path /repo/gitleaks-report.json --exit-code 1 || status=$?
          if [ -s gitleaks-report.json ]; then
            node -e 'const fs=require("node:fs"); const findings=JSON.parse(fs.readFileSync("gitleaks-report.json","utf8")); for (const f of findings) console.log(JSON.stringify({ruleID:f.RuleID,file:f.File,commit:f.Commit,line:f.StartLine,description:f.Description}));'
          fi
          exit "$status"
